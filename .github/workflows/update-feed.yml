name: Update RSS feed

on:
  schedule:
    - cron: "0 14 * * *"   # ~7am Pacific (UTC offset drifts 1hr across DST)
    - cron: "0 1 * * *"    # ~6pm Pacific (UTC offset drifts 1hr across DST)
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Restore post state cache
        uses: actions/cache/restore@v6
        with:
          path: data/posts.json
          key: posts-state-${{ github.run_id }}
          restore-keys: posts-state-

      - name: Run feed update
        run: uv run update-feed

      - name: Save post state cache
        uses: actions/cache/save@v6
        with:
          path: data/posts.json
          key: posts-state-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
