[project]
name = "claude-blog-rss"
version = "0.1.0"
description = "Unofficial RSS feed generator for claude.com/blog"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedgen>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "pytest>=8.0",
]

[project.scripts]
update-feed = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
